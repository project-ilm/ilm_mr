<text x="32" y="139" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* क्रमवार यादीत द्विमान शोध */</text>
<text x="32" y="160" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णांक द्विमान_शोध(पूर्णांक मूल्ये[], पूर्णांक मोजणी, पूर्णांक किल्ली) {</text>
<text x="32" y="181" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  पूर्णांक खालचा = 0, वरचा = मोजणी - 1;</text>
<text x="32" y="202" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  पर्यंत (खालचा &lt;= वरचा) {</text>
<text x="32" y="223" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    पूर्णांक मधला = खालचा + (वरचा - खालचा) / 2;</text>
<text x="32" y="244" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    जर (मूल्ये[मधला] == किल्ली) परत मधला;</text>
<text x="32" y="265" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    जर (मूल्ये[मधला] &lt; किल्ली) खालचा = मधला + 1; अन्यथा वरचा = मधला - 1;</text>
<text x="32" y="286" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="32" y="307" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  परत -1;</text>
<text x="32" y="328" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="32" y="349" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णांक मुख्य(शून्य) {</text>
